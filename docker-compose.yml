version: "3.9"

services:

  # ──────────────────────────────────────────────────────────
  # Oracle DB 23ai — Primary relational database
  # ──────────────────────────────────────────────────────────
  oracle:
    image: gvenzl/oracle-free:latest
    container_name: sinhala_legal_oracle
    restart: unless-stopped
    environment:
      ORACLE_DATABASE: ${ORACLE_DB:-sinhala_legal_db}
      APP_USER: ${ORACLE_USER:-legal_user}
      APP_PASSWORD: ${ORACLE_PASSWORD:-change_me_secure_password}
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:-change_me_sys_password}
    volumes:
      - oracle_data:/opt/oracle/oradata
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────
  # ChromaDB — Vector database for RAG embeddings
  # ──────────────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: sinhala_legal_chroma
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "${CHROMA_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────
  # Redis 7 — Rate limiting and caching
  # ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sinhala_legal_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────
  # FastAPI Backend
  # ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sinhala_legal_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ORACLE_HOST: oracle
      CHROMA_HOST: chromadb
      REDIS_URL: redis://redis:6379/0
    depends_on:
      oracle:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./training/checkpoints:/app/checkpoints:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ──────────────────────────────────────────────────────────
  # Vite + React Frontend (production build served by Nginx)
  # ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sinhala_legal_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  oracle_data:
  chroma_data:
  redis_data:
